{% extends "base.html" %}

{% block content %}
<section class="auth-shell auth-shell-compact">
    <div class="auth-intro card">
        <div class="card-body">
            <p class="eyebrow">New adventurer</p>
            <h1 class="h2 mb-3">Create a password account</h1>
            <p class="auth-copy">
                Use Github or register here to keep to save your dungeon progress.
            </p>
        </div>
    </div>

    <div class="auth-panel p-4 p-md-5">
        <h2 class="h4 mb-4">Register</h2>
        <form method="POST" action="{{ url_for('register') }}" data-disable-on-submit>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control form-control-lg" id="username" name="username" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control form-control-lg" id="password" name="password" required minlength="6">
                <div class="form-text">At least 6 characters.</div>
            </div>
            <div class="d-grid gap-3">
                <button type="submit" class="btn btn-primary btn-lg">Create account</button>
                <a href="{{ url_for('login') }}" class="btn btn-outline-secondary btn-lg">Already have an account?</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
