{% extends "base.html" %}

{% block content %}
<section class="auth-shell">
    <div class="auth-intro card">
        <div class="card-body">
            <p class="eyebrow">Welcome back to a world of Shadows.</p>
            <h1 class="h2 mb-3">Log in to ShadowSpawner</h1>
            <p class="auth-copy">
                Use your account, or jump in with GitHub. (Your dungeon saves are tied to your account.)
            </p>
        </div>
    </div>

    <div class="auth-panel p-4 p-md-5">
        <h2 class="h4 mb-4">Log in</h2>
        <form method="POST" action="{{ url_for('login') }}" data-disable-on-submit>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control form-control-lg" id="username" name="username" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control form-control-lg" id="password" name="password" required>
            </div>
            <div class="form-check form-switch mb-4 remember-switch">
                <input class="form-check-input" type="checkbox" value="1" id="remember" name="remember">
                <label class="form-check-label" for="remember">Remember me</label>
            </div>
            <div class="d-grid gap-3">
                <button type="submit" class="btn btn-primary btn-lg">Log in</button>
                <a href="/login/github" class="btn btn-outline-dark btn-lg oauth-button">Sign in with GitHub</a>
            </div>
            <div class="auth-secondary-links mt-3">
                <a href="{{ url_for('register') }}">Need an account?</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
