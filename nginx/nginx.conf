# nginx.conf — SD Dungeon Generator production reverse proxy
#
# Adapted from Study Guide §4 for our project.
# Owner: Mario (DB/security) — server block, rate limits, request filtering
# Owner: Charles (frontend)  — security headers, CSP values, static asset tuning
#
# This file is mounted read-only into the nginx container via docker-compose.

# ── Upstream: where nginx forwards proxied requests ──
upstream app {
    server unix:/tmp/gunicorn.sock;
}

# ── Rate limiting zone for auth endpoints (10 MB state, 5 req/min per IP) ──
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

# ── HTTPS server ──
server {
    listen 443 ssl http2;
    server_name 44-252-95-80.sslip.io 44.252.95.80 localhost;

    # TLS configuration (self-signed cert, generated per environment)
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ── Security headers (applied to every response) ──
    # CSP audit (Week 10 open item, resolved):
    #   - script-src 'self'         — no inline scripts remain; runs.html's
    #     delete handler moved to static/js/runs.js, the game uses module
    #     scripts from /site/src/.
    #   - style-src allows cdn.jsdelivr.net (Bootstrap CSS in base.html) and
    #     'unsafe-inline' for the <style> block in S3_content/about.html.
    #     Inline *styles* are a far smaller risk than inline scripts.
    #   - img-src includes data: for canvas/token data URIs.
    #   - frame-ancestors 'none' mirrors X-Frame-Options DENY for modern browsers.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # style-src 'unsafe-inline' dropped (CONTRACTS.md §17 item 3): about.html's
    # inline <style> moved to about.css, so no inline styles remain anywhere.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # ── Static assets served directly by nginx (not Flask) ──

    # Flask's static directory
    location /static/ {
        alias /app/static/;
        expires 30d;
    }

    # Dungeon frontend (S3_content) — previously served by Flask's /site/ route
    location /site/ {
        alias /app/S3_content/;
        expires -1;
        add_header Cache-Control "no-store" always;
    }

    # ── Rate-limited auth endpoints ──
    # 5 req/min with burst=3 — lets a user mistype a few times without lockout.
    # /auth/github/callback is deliberately NOT rate-limited: throttling the
    # OAuth return from GitHub risks failing legitimate logins.

    location /login {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /register {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login/github {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Rate-limited multiplayer endpoints (CONTRACTS.md §16.6) ──
    # Session create (POST /api/multiplayer/sessions — exact path, no trailing
    # segments) and join attempts share the auth zone: join takes a guessable
    # invite code, so throttling guessing matters as much as login throttling.
    # Session refresh (GET .../<code>) is NOT limited — clients poll presence.

    location = /api/multiplayer/sessions {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/multiplayer/sessions/[^/]+/join$ {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Everything else proxied to gunicorn ──
    location / {
        proxy_pass http://app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Redirect plain HTTP → HTTPS ──
server {
    listen 80;
    server_name 44-252-95-80.sslip.io 44.252.95.80 localhost;
    return 301 https://$host$request_uri;
}
