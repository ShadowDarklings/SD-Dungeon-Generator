# nginx.conf — SD Dungeon Generator production reverse proxy
#
# Adapted from Study Guide §4 for our project.
# Owner: Mario (DB/security) — server block, rate limits, request filtering
# Owner: Charles (frontend)  — security headers, CSP values, static asset tuning
#
# This file is mounted read-only into the nginx container via docker-compose.

# ── Upstream: where nginx forwards proxied requests ──
upstream app {
    server unix:/tmp/gunicorn.sock;
}

# ── Rate limiting zone for auth endpoints (10 MB state, 5 req/min per IP) ──
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

# ── HTTPS server ──
server {
    listen 443 ssl http2;
    server_name localhost;

    # TLS configuration (self-signed cert, generated per environment)
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ── Security headers (applied to every response) ──
    # Charles: tune these values for our project. CSP is the critical one —
    # default-src 'self' WILL break inline JS/CSS in S3_content/.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # ── Static assets served directly by nginx (not Flask) ──

    # Flask's static directory
    location /static/ {
        alias /app/static/;
        expires 30d;
    }

    # Dungeon frontend (S3_content) — previously served by Flask's /site/ route
    location /site/ {
        alias /app/S3_content/;
        expires 30d;
    }

    # ── Rate-limited auth endpoints ──
    # 5 req/min with burst=3 — lets a user mistype a few times without lockout.
    # /auth/github/callback is deliberately NOT rate-limited: throttling the
    # OAuth return from GitHub risks failing legitimate logins.

    location /login {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /register {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login/github {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Everything else proxied to gunicorn ──
    location / {
        proxy_pass http://app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Redirect plain HTTP → HTTPS ──
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}
