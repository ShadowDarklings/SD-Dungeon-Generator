server_tokens off;
upstream app { server unix:/tmp/gunicorn.sock; }
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=join:10m rate=12r/m;
log_format private_access '$remote_addr $request_method $uri $status $request_time';

server {
    listen 443 ssl;
    http2 on;
    server_name ctreeder.com;
    if ($host != ctreeder.com) { return 444; }
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 5m;
    limit_req_status 429;
    access_log /var/log/nginx/access.log private_access;
    proxy_set_header Host ctreeder.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_read_timeout 65s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

    location ~ /\. { return 404; }
    location ~* ^/(?:wp-|wordpress|phpmyadmin|vendor|cgi-bin|actuator|server-status) { return 404; }
    location ~* \.(?:php|env|sql|bak|ini|log)$ { return 404; }
    location /static/ { alias /app/static/; expires 1d; }
    location /site/ { alias /app/S3_content/; expires -1; }
    location ~ ^/(?:login|register|recover)(?:/|$) {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://app;
    }
    location = /api/rooms/join {
        limit_req zone=join burst=6 nodelay;
        proxy_pass http://app;
    }
    location ^~ /api/multiplayer/ { return 410; }
    location / { proxy_pass http://app; }
}
server {
    listen 80;
    server_name ctreeder.com;
    if ($host != ctreeder.com) { return 444; }
    access_log /var/log/nginx/access.log private_access;
    return 308 https://ctreeder.com$request_uri;
}
