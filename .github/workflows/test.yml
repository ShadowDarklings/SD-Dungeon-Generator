name: Tests

"on":
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: sd_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d sd_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SECRET_KEY: ci-test-secret-not-for-production
      OAUTH_CLIENT_ID: ci-placeholder
      OAUTH_CLIENT_SECRET: ci-placeholder
      FLASK_ENV: development
      PUBLIC_BASE_URL: ""
      RATELIMIT_STORAGE_URI: memory://
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://test:test-only@127.0.0.1:5432/sd_test' || 'sqlite:///test.db' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-audit
          npm ci
      - name: Check dependencies
        run: |
          pip-audit
          npm audit --omit=dev
      - name: Runtime tests
        run: npm test
      - name: Backend tests
        run: pytest -q --ignore=tests/e2e
      - name: Reject tracked secrets and generated databases
        run: python scripts/check_tracked_secrets.py
