# docker-compose.yml — SD Dungeon Generator production stack
#
# Three-container setup: nginx (TLS termination) → app (gunicorn) → db (Postgres)
# Adapted from Study Guide §6 for our project.
#
# Run with:
#   mkdir -p nginx/certs
#   openssl req -x509 -newkey rsa:2048 -nodes \
#     -keyout nginx/certs/key.pem -out nginx/certs/cert.pem \
#     -days 365 -subj "/CN=localhost"
#   docker compose up --build
#
# Then visit: https://localhost

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - gunicorn-socket:/tmp
      - ./static:/app/static:ro
      - ./S3_content:/app/S3_content:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - gunicorn-socket:/tmp
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
      FLASK_ENV: production
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
      SHADOWDARKLINGS_IMPORT_ENABLED: ${SHADOWDARKLINGS_IMPORT_ENABLED:-0}
    env_file:
      - path: .env
        required: true
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import requests,sys; sys.exit(0 if requests.get('http://127.0.0.1:8000/healthz', timeout=5).ok else 1)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
      timeout: 2s
      retries: 10
    restart: unless-stopped
    # NOTE: db has NO 'ports:' — only reachable from other services on the
    # docker network, never from the host or public internet. This is the
    # trust boundary (see CONTRACTS.md §15.8).

volumes:
  gunicorn-socket:   # shared between nginx and app for the unix socket
  pgdata:            # persists the database across container restarts
